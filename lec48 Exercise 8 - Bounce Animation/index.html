<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8 - Bounce Animation</title>
    <style>
        .container {
            position: relative;
            background-color: blue;
            width: 800px;
            height: 800px;
        }

        .ball {
            background-color: red;
            width: 80px;
            height: 80px;
            position: absolute;
            left: 0px;
            bottom: 0px;
            border-radius: 60px;
            animation: ryuk 1.7s ease-in-out 1s infinite;
        }

        @keyframes ryuk {
            0% {
                transform: translate(0, 0);
            }
            10% {
                transform: translate(70px, -450px);
            }
            20% {
                transform: translate(140px, 0);
            }
            28% {
                transform: translate(200px, -300px);
            }
            36% {
                transform: translate(260px, 0);
            }
            43% {
                transform: translate(310px, -220px);
            }
            50% {
                transform: translate(360px, 0);
            }
            56% {
                transform: translate(405px, -160px);
            }
            62% {
                transform: translate(450px, 0);
            }
            68% {
                transform: translate(490px, -120px);
            }
            74% {
                transform: translate(530px, 0);
            }
            79% {
                transform: translate(565px, -90px);
            }
            84% {
                transform: translate(600px, 0);
            }
            88% {
                transform: translate(630px, -60px);
            }
            92% {
                transform: translate(660px, 0);
            }
            95% {
                transform: translate(680px, -35px);
            }
            98% {
                transform: translate(695px, 0);
            }
            100% {
                transform: translate(700px, 0);
            }
        }

        /* 
        @keyframes ryuk {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(125px, -100px);
            }

            50% {
                transform: translate(250px, 0);
            }

            75% {
                transform: translate(375px, -100px);
            }

            100% {
                transform: translate(500px, 0);
            }
        } */

        /* 
        /* @keyframes ryuk2{
            from{

            }
            to{
                transform: translateX(500px);
            }
        } */
    </style>
</head>

<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>

</html>
