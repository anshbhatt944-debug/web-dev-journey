<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM - Quick Quiz</title>
</head>

<body>

    <h1>User Inputs:-</h1>
    <form action="post">
        <div>
            <label for="username">Enter your name:-</label>
            <input type="text" id="username" placeholder="Enter here" name="name">
        </div>
        <div>
            <label for="city">Enter your city:-</label>
            <input type="text" id="city" placeholder="Enter here" name="city">
        </div>
        <div>
            <label for="pincode">Enter your pincode:-</label>
            <input type="text" id="pincode" placeholder="Enter here" name="pincode">
        </div>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
