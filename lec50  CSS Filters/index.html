<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        img{
            height: 634px;
            width: 688px;
            /* filter: blur(21px); */
        }
        .img1{
            filter: brightness(100%) contrast(235%);
        }
        .img2{
            /* filter: brightness(200%); */
            filter: invert(1) opacity(0.5);
        }
        
        .img3{
            filter: sepia(100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="//www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_180x.jpg?v=1714684265 180w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_360x.jpg?v=1714684265 360w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_540x.jpg?v=1714684265 540w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_720x.jpg?v=1714684265 720w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_900x.jpg?v=1714684265 900w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_1080x.jpg?v=1714684265 1080w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_1296x.jpg?v=1714684265 1296w, //www.analogrecordshop.com/cdn/shop/files/71Ragj-qa1L._AC_SL1500_1420x.jpg?v=1714684265 1420w" alt="">
        <img class="img2" src="imageChar.jpg" alt="">
        <img class="img3" src="megaCharIm.jpg" alt="">
    </div>
</body>
</html>
