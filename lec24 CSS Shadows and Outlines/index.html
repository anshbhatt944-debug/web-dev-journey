<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #483de0;
        }

        .text-shadow {
            text-shadow: 9px 5px 6px rgb(84, 45, 255);
            outline-offset: 4px;
            outline: 2px solid green;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a Box
    </div>
    <p class="text-shadow">
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Qui odio molestias quos tempora sunt quam sequi
        officiis minima labore blanditiis. Provident, velit omnis!
    </p>
</body>

</html>
