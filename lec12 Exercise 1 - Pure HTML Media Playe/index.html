<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure HTML Media Player</title>
</head>

<body>
    <div>
        <h1>All the Audio files</h1>
    </div>
    <div>
        <audio src="audio1.mp3" controls></audio>
        <audio src="audio2.mp3" controls></audio>
        <audio src="audio3.mp3" controls></audio>
        <audio src="audio4.mp3" controls></audio>
        <audio src="audio5.mp3" controls></audio>
        <audio src="audio6.mp3" controls></audio>
    </div>
    <div>
        <h1>These are all the Video files</h1>
    </div>
    <div>
        <video src="v1.mp4" height="250" controls></video>
        <video src="v2.mp4" height="250" controls></video>
        <video src="v3.mp4" height="250" controls></video>
        <video src="v4.mp4" height="250" controls></video>
        <video src="v5.mp4" height="250" controls></video>
        <video src="v6.mp4" height="250" controls></video>
    </div>




</body>

</html>
